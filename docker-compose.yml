# This is what you paste into Portainer (Stacks > Add stack) to
# run the image once it's been built and published by GitHub.
services:
  recipes:
    image: ghcr.io/djnw8fs748-eng/whattoeat:latest
    container_name: recipes
    restart: unless-stopped
    ports:
      - target: 80
        published: 8090
        protocol: tcp
