# This is what you paste into Portainer (Stacks > Add stack) to
# run the image once it's been built and published by GitHub.
# Replace YOUR-USERNAME with your actual GitHub username.
services:
  recipes:
    image: ghcr.io/YOUR-USERNAME/recipe-catalogue:latest
    container_name: recipes
    restart: unless-stopped
    ports:
      - "8090:80"
