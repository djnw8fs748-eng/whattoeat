server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Built JS/CSS files have a content hash in their name (e.g.
    # index-51meIcuN.js), so browsers can safely cache them for a year —
    # a new build always produces new file names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Always re-check the page itself so a new deploy shows up straight away.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
