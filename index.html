<script>
  // Paint the right background before React loads, so dark-mode users
  // don't see a white flash. src/theme.ts takes over from here.
  try {
    if (localStorage.getItem('wte-dark') === '1') {
      document.documentElement.style.background = '#1F1F21';
      document.documentElement.style.colorScheme = 'dark';
    }
  } catch (e) {}
</script>
