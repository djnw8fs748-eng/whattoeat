# This file tells GitHub: "whenever code is pushed to main, build
# the Dockerfile in this repo and publish the result as a container
# image to GitHub's own container registry (GHCR)."
# You don't run this yourself — GitHub runs it for you automatically.

name: Build and publish Docker image

on:
  push:
    branches: ["main"]

env:
  # This becomes ghcr.io/<your-github-username>/<repo-name>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed so the workflow can push to GHCR

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
