# This file tells GitHub: "whenever code is pushed to main, build
# the Dockerfile in this repo and publish the result as a container
# image to GitHub's own container registry (GHCR)."
# You don't run this yourself — GitHub runs it for you automatically.

name: Build and publish Docker image

on:
  push:
    branches: ["main"]

env:
  # This becomes ghcr.io/<your-github-username>/<repo-name>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed so the workflow can push to GHCR

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build recipes.json from the recipes/ category files
        # The recipes/ folder is the source of truth (one small file per
        # category, plus _index.json for quick lookups). This step just
        # concatenates them into the single recipes.json the site fetches,
        # so the browser still only ever makes one request.
        run: |
          python3 - <<'PYEOF'
          import json

          with open('recipes/_index.json') as f:
              index = json.load(f)

          seen_files = []
          for entry in index:
              if entry['file'] not in seen_files:
                  seen_files.append(entry['file'])

          recipes = []
          for filename in seen_files:
              with open(f'recipes/{filename}') as rf:
                  recipes.extend(json.load(rf))

          with open('recipes.json', 'w') as out:
              json.dump(recipes, out, indent=2, ensure_ascii=False)

          print(f"Built recipes.json with {len(recipes)} recipes from {len(seen_files)} category files")
          PYEOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
