name: Build and publish Docker image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}
  API_IMAGE_NAME: ${{ github.repository }}-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Generate favicon PNGs and ICO from favicon.svg
        run: |
          pip install --quiet cairosvg pillow
          python3 - <<'PYEOF'
          import cairosvg
          from PIL import Image

          for size, name in [(180, 'apple-touch-icon.png'), (32, 'favicon-32.png'), (16, 'favicon-16.png')]:
              cairosvg.svg2png(url='favicon.svg', write_to=name, output_width=size, output_height=size)

          Image.open('favicon-16.png').save('favicon.ico', sizes=[(16, 16), (32, 32)])
          print("Favicon assets generated")
          PYEOF

      - name: Run api tests
        run: pip install -r api/requirements.txt -r api/requirements-dev.txt && python -m pytest api/tests/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      # `npm run recipes` checks the recipe data and builds recipes.json from
      # recipes/ (it also runs automatically before every `npm run build`).
      - name: Install app dependencies, check recipes and type-check
        run: |
          npm ci
          npm run recipes
          npm run typecheck

      # Playwright builds the React app and serves dist/ itself
      # (see tests/e2e/playwright.config.ts).
      - name: Run E2E tests
        run: |
          cd tests/e2e
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push recipes image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ env.API_IMAGE_NAME }}:latest
            ghcr.io/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
